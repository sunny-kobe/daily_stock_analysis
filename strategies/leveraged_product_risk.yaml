# Daily Leveraged Product Risk / 每日杠杆产品风险

name: leveraged_product_risk
display_name: 每日杠杆产品风险
description: 区分每日杠杆产品与底层资产，核验每日再平衡、路径依赖、波动损耗和可执行交易单位。
category: framework
core_rules: [1, 3, 5, 6]
